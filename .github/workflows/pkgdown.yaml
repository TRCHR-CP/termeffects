# Builds the pkgdown website and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://trchr-cp.github.io/termeffects/.
# Based on the r-lib/actions pkgdown example.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        # errors are also written as an annotation, visible on the run's page
        run: |
          tryCatch(
            pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE),
            error = function(e) {
              msg <- paste(c(conditionMessage(e), if (!is.null(e$parent)) conditionMessage(e$parent)), collapse = " | ")
              cat("::error::", gsub("\n", " ", msg), "\n", sep = "")
              quit(status = 1)
            })
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
